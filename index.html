<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukasi - Kuis Pintar</title>
    <!-- Menghubungkan file CSS terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Tampilan Pendaftaran Nama -->
        <div id="screen-login">
            <h1>🎮 Kuis Edukasi Interaktif</h1>
            <p>Masukkan nama kamu untuk mulai bermain:</p>
            <input type="text" id="player-name" placeholder="Nama Lengkap...">
            <br>
            <button onclick="mulaiGame()">Mulai Bermain</button>
        </div>

        <!-- Tampilan Loading -->
        <div id="screen-loading" class="hidden">
            <h2>Memuat Soal dari Google Sheets...</h2>
            <p>Mohon tunggu sebentar ⏳</p>
        </div>

        <!-- Tampilan Soal Kuis -->
        <div id="screen-quiz" class="hidden">
            <h3 id="question-counter">Soal 1 dari 5</h3>
            <p id="question-text">Pertanyaan akan muncul di sini</p>
            <div id="options-container">
                <!-- Tombol pilihan ganda akan digenerate otomatis lewat JS -->
            </div>
        </div>

        <!-- Tampilan Selesai -->
        <div id="screen-result" class="hidden">
            <h1>🎉 Permainan Selesai!</h1>
            <p>Skor Kamu:</p>
            <p id="score-board">0</p>
            <p id="sync-status" style="color: gray; font-size: 14px;"></p>
            <button onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <!-- Menghubungkan file JavaScript terpisah -->
    <script src="script.js"></script>
</body>
</html>
