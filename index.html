<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest 2D - Modern Learning Game</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- File CSS Eksternal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD Overlay -->
    <div id="hud">
      <div class="hud-box">Skor: <span id="score">0</span></div>
      <div class="hud-box">Nyawa: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <!-- Quiz Modal Container -->
    <div id="quiz-modal">
      <div class="badge" id="quiz-category">Kategori</div>
      <div class="question-text" id="quiz-question">Pertanyaan akan muncul di sini...</div>
      <div class="options-grid" id="options-container">
        <!-- Opsi jawaban dimasukkan secara dinamis via script.js -->
      </div>
    </div>
  </div>

  <!-- File JavaScript Eksternal -->
  <script src="script.js"></script>
</body>
</html>
