<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Edukasi 2D - Quiz Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <!-- Screen 1: Form Nama Pemain -->
    <div id="start-screen" class="screen active">
      <h1>🎮 Educational Quiz Game</h1>
      <p>Masukkan nama kamu untuk memulai permainan!</p>
      <input type="text" id="player-name" placeholder="Nama Kamu" required />
      <button id="btn-start" onclick="startGame()">Mulai Game</button>
    </div>

    <!-- Screen 2: Area Permainan Game 2D -->
    <div id="game-screen" class="screen">
      <div class="header-info">
        <span>Pemain: <strong id="display-name">-</strong></span>
        <span>Skor: <strong id="score">0</strong></span>
      </div>

      <!-- Canvas untuk Elemen Game 2D -->
      <canvas id="gameCanvas" width="600" height="200"></canvas>

      <!-- Modal/Pop-up Soal yang Diambil dari Google Sheets -->
      <div id="quiz-box">
        <h3 id="question-text">Memuat pertanyaan...</h3>
        <div id="options-container" class="options-grid"></div>
      </div>
    </div>

    <!-- Screen 3: Hasil & Skor Akhir -->
    <div id="end-screen" class="screen">
      <h1>🎉 Permainan Selesai!</h1>
      <p>Skor Akhir Kamu:</p>
      <h2 id="final-score">0</h2>
      <p id="status-message">Mengirim skor ke Google Sheets...</p>
      <button onclick="restartGame()">Main Lagi</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
