<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest - Game Edukasi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- START SCREEN -->
        <section id="startScreen" class="screen active">
            <div class="logo">🎓</div>
            <h1>Edu<span>Quest</span></h1>
            <p>Petualangan belajar yang menyenangkan!</p>

            <input
                type="text"
                id="playerName"
                placeholder="Masukkan nama kamu..."
                maxlength="20"
            >

            <button id="startBtn" class="main-btn">
                🚀 Mulai Bermain
            </button>
        </section>

        <!-- GAME SCREEN -->
        <section id="gameScreen" class="screen">

            <div class="top-bar">
                <div class="stat">
                    ❤️ <span id="lives">3</span>
                </div>

                <div class="stat">
                    ⭐ <span id="score">0</span>
                </div>

                <div class="stat">
                    🏆 Level <span id="level">1</span>
                </div>

                <div class="stat">
                    ⏱️ <span id="timer">15</span>
                </div>
            </div>

            <div class="progress-container">
                <div id="progressBar"></div>
            </div>

            <div class="question-card">

                <div class="question-number">
                    Pertanyaan <span id="questionNumber">1</span>
                </div>

                <h2 id="question">
                    Loading...
                </h2>

                <div id="answers" class="answers"></div>

                <div id="feedback" class="feedback"></div>

                <button id="nextBtn" class="next-btn hidden">
                    Pertanyaan Berikutnya →
                </button>

            </div>

        </section>

        <!-- RESULT SCREEN -->
        <section id="resultScreen" class="screen">

            <div class="result-icon">🏆</div>

            <h1>Permainan Selesai!</h1>

            <p id="resultMessage"></p>

            <div class="result-card">
                <div>
                    <span>Nama</span>
                    <strong id="resultName">-</strong>
                </div>

                <div>
                    <span>Skor</span>
                    <strong id="resultScore">0</strong>
                </div>

                <div>
                    <span>Benar</span>
                    <strong id="resultCorrect">0</strong>
                </div>

                <div>
                    <span>Salah</span>
                    <strong id="resultWrong">0</strong>
                </div>
            </div>

            <button id="restartBtn" class="main-btn">
                🔄 Main Lagi
            </button>

        </section>

    </div>

    <script src="game.js"></script>
</body>
</html>
